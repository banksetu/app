name: PR101 Actual UI Screenshot PDF (Draft Only)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/layout-studio-visual-proof.yml
      - scripts/capture-layout-screenshots.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-actual-ui:
    if: github.event.pull_request.number == 101 || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Launch isolated actual React UI preview (no Firebase)
        run: |
          CODESPACE_NAME=pr101-visual-proof npm run dev > /tmp/banksetu-vite.log 2>&1 &
          echo $! > /tmp/banksetu-vite.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/banksetu-vite.log
          exit 1
      - name: Capture real screens and generate screenshot PDF
        run: node scripts/capture-layout-screenshots.mjs
      - name: Upload actual screenshots and PDF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: banksetu-pr101-running-ui-pdf
          path: layout-visual-proof/
          if-no-files-found: warn
          retention-days: 7
