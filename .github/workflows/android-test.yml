name: Build Android testing APK
on:
  push:
    branches:
      - codex/spark-client-workspace-20261001
    paths:
      - src/core/license*.ts
      - desktop/license-guard.cjs
      - .github/workflows/android-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - name: Critical licensing tests before building the APK
        run: npm run test:worker && npm run test:local && npm run test:bridge && npm run check:schema
      - run: npm run android:sync
        env:
          VITE_BANKSETU_WORKER_URL: https://banksetu-client-api.banksetu2026.workers.dev
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BankSetu-Android-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
