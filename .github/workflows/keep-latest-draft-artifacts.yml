name: Keep latest draft test artifacts
on:
  workflow_run:
    workflows:
      - Layout Studio Draft Validation
      - Isolated PR2 Local Agent (no deployment)
      - PR2 Bridge Windows acceptance (no release)
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: latest-draft-test-artifacts
  cancel-in-progress: false
jobs:
  prune-superseded:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.head_branch == 'codex/passbook-wizard-word-draft-20261106' || github.event.workflow_run.head_branch == 'codex/pr2-local-test-20261021'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove only superseded successful draft build artifacts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const repo=process.env.GITHUB_REPOSITORY;
          if(repo!=='banksetu/app') throw new Error('Unexpected repository');
          const event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const source=event.workflow_run;
          const audit=process.env.GITHUB_EVENT_NAME==='workflow_dispatch';
          if(audit) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Automatic cleanup enabled only after a successful test workflow for draft #100 or #58. It keeps the newest successful artifact of every known test-output type, and deletes older copies only. No run logs, source code, published release assets, or production workflow artifacts are deleted. Manual dispatch is audit-only.\n');
            console.log('Configuration audit passed. No deletion during manual audit.');
            process.exit(0);
          }
          const branches=new Set(['codex/passbook-wizard-word-draft-20261106','codex/pr2-local-test-20261021']);
          const workflows=new Set(['Layout Studio Draft Validation','Isolated PR2 Local Agent (no deployment)','PR2 Bridge Windows acceptance (no release)']);
          if(!source || source.conclusion!=='success' || source.head_repository?.full_name!==repo || !branches.has(source.head_branch) || !workflows.has(source.name) || !Number.isSafeInteger(source.workflow_id)) throw new Error('Unapproved trigger');
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function api(path,method='GET'){
            const r=await fetch('https://api.github.com/repos/'+repo+path,{method,headers,signal:AbortSignal.timeout(30000)});
            if(method==='DELETE' && r.status===404) return null;
            if(!r.ok) throw new Error(method+' '+path+' failed: '+r.status);
            return r.status===204?null:r.json();
          }
          async function all(path,key){
            const result=[];
            for(let page=1;;page++){
              const data=await api(path+(path.includes('?')?'&':'?')+'per_page=100&page='+page);
              if(!Array.isArray(data[key])) throw new Error('Unexpected response');
              result.push(...data[key]);
              if(data[key].length<100) return result;
            }
          }
          const runs=await all('/actions/workflows/'+source.workflow_id+'/runs?branch='+encodeURIComponent(source.head_branch)+'&status=success','workflow_runs');
          const successful=new Map(runs.filter(r=>r.status==='completed' && r.conclusion==='success' && r.head_branch===source.head_branch && r.repository?.full_name===repo).map(r=>[r.id,r]));
          function family(name){
            if(/^banksetu-layout-draft-windows-[0-9a-f]{40}$/.test(name)) return 'layout-windows';
            if(/^banksetu-layout-draft-android-[0-9a-f]{40}$/.test(name)) return 'layout-android';
            if(name==='PR2-Local-Test-Agent' || name==='BankSetu-PR2-UNSIGNED-NOT-FOR-RELEASE') return name;
            return null;
          }
          const artifacts=(await all('/actions/artifacts','artifacts')).filter(a=>!a.expired && successful.has(a.workflow_run?.id) && family(a.name));
          const latest=new Map();
          for(const a of artifacts){
            const f=family(a.name);
            const prior=latest.get(f);
            if(!prior || Date.parse(a.created_at)>Date.parse(prior.created_at)) latest.set(f,a);
          }
          const obsolete=artifacts.filter(a=>latest.get(family(a.name)).id!==a.id && Date.parse(a.created_at)<Date.parse(latest.get(family(a.name)).created_at));
          let deleted=0,bytes=0;
          for(const a of obsolete){
            if(!Number.isSafeInteger(a.id)) throw new Error('Invalid artifact ID');
            await api('/actions/artifacts/'+a.id,'DELETE');
            deleted++; bytes+=a.size_in_bytes;
            await new Promise(r=>setTimeout(r,500));
          }
          const result='Draft branch: '+source.head_branch+'; superseded artifacts deleted: '+deleted+'; bytes removed: '+bytes+'; newest successful artifact types retained: '+latest.size+'. Run logs, source code and releases were preserved.';
          console.log(result);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,result+'\n');
          NODE
