name: Deploy Bank Setu Firebase Hosting

on:
  push:
    branches:
      - codex/spark-client-workspace-20261001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banksetu-firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/spark-client-workspace-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check update notification recovery
        run: npm run test:updates

      - name: Check client sheet column layout
        run: npm run check:schema

      - name: Build production frontend
        run: npm run build
        env:
          VITE_BANKSETU_WORKER_URL: https://banksetu-client-api.banksetu2026.workers.dev

      - name: Add deployment identification
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/deployment.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            builtAt: new Date().toISOString(),
            workerUrl: 'https://banksetu-client-api.banksetu2026.workers.dev',
          }, null, 2) + '\n');
          NODE

      - name: Keep the last published release manifest until installers exist
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/version.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(manifest.latestVersion) || !manifest.androidDownloadUrl || !manifest.windowsDownloadUrl) {
            throw new Error('public/version.json must point to an existing published release.');
          }
          NODE

      - name: Check Firebase deployment credential
        env:
          FIREBASE_DEPLOY_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BANKSETU_69E2F }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { createPrivateKey } from 'node:crypto';
          import { join } from 'node:path';
          const value = process.env.FIREBASE_DEPLOY_ACCOUNT;
          if (!value) {
            console.error('::error::Add repository Actions secret FIREBASE_SERVICE_ACCOUNT_BANKSETU_69E2F with the deployment service-account JSON, then re-run this failed job.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Frontend build passed; Firebase authorization is needed\nAdd FIREBASE_SERVICE_ACCOUNT_BANKSETU_69E2F under Settings > Secrets and variables > Actions. Its value must be the full JSON for a deployment service account in banksetu-69e2f. Required roles for this live Hosting deployment: Firebase Hosting Admin and API Keys Viewer. Then re-run this failed job.\n');
            process.exit(1);
          }
          let account;
          try { account = JSON.parse(value); } catch {
            console.error('::error::The Firebase deployment secret must contain valid service-account JSON.');
            process.exit(1);
          }
          if (account.type !== 'service_account' || account.project_id !== 'banksetu-69e2f' || !account.client_email || !account.private_key) {
            console.error('::error::Use a complete service-account JSON key for project banksetu-69e2f.');
            process.exit(1);
          }
          // Some JSON secret editors double-escape PEM line breaks. Verify the
          // existing key before calling Firebase and normalize only that case.
          let privateKey = account.private_key;
          try { createPrivateKey(privateKey); }
          catch {
            privateKey = privateKey.replace(/\\n/g, '\n').replace(/\r\n/g, '\n');
            try { createPrivateKey(privateKey); }
            catch {
              console.error('::error::The configured Firebase service-account private_key is not a decodable PEM key. Replace the invalid repository secret; do not paste the key into logs.');
              process.exit(1);
            }
          }
          const credentialPath = join(process.env.RUNNER_TEMP, 'banksetu-firebase-credentials.json');
          writeFileSync(credentialPath, JSON.stringify({ ...account, private_key: privateKey }), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${credentialPath}\n`);
          // Publish only the non-secret account identity, never the key.
          if (/^[a-zA-Z0-9._@-]+$/.test(account.client_email)) console.log('Deployment principal: ' + account.client_email);
          NODE

      - name: Deploy Firestore security rules
        run: npx --yes firebase-tools@15.31.0 deploy --only firestore:rules --project banksetu-69e2f --non-interactive

      - name: Deploy Firebase Hosting live
        run: npx --yes firebase-tools@15.31.0 deploy --only hosting:banksetu-app --project banksetu-69e2f --non-interactive

      - name: Verify live frontend commit
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const origin = 'https://banksetu-app.web.app';
          let verified = false;
          for (let attempt = 1; attempt <= 4; attempt++) {
            try {
              const response = await fetch(`${origin}/deployment.json?revision=${process.env.GITHUB_SHA}`, { signal: AbortSignal.timeout(15000), cache: 'no-store' });
              if (response.ok && (await response.json()).commit === process.env.GITHUB_SHA) {
                verified = true;
                break;
              }
            } catch { /* Retry a transient Hosting response. */ }
            if (attempt < 4) await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!verified) throw new Error('The expected commit is not yet served at the live Hosting URL. Check the Hosting deployment before testing the app.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Firebase Hosting deployment verified',
            `Commit: ${process.env.GITHUB_SHA}`,
            `Live app: ${origin}`,
            'The production build contains the Cloudflare Worker URL.',
            '',
          ].join('\n'));
          NODE
