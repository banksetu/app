name: Build Windows release
on:
  workflow_call:
    inputs:
      release_ref:
        required: false
        type: string
      staged_release:
        description: Draft GitHub release for signed build assets
        required: false
        type: string
  workflow_dispatch:
jobs:
  signed-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:desktop-syntax
      - run: node --test cloudflare/worker.test.js scripts/workspace-regression.test.mjs scripts/local-first.test.mjs scripts/bridge.test.mjs scripts/offline-backup.test.mjs desktop/store.test.cjs desktop/testUpdater.test.cjs desktop/print-preview.test.cjs desktop/app-protocol.test.cjs
      - run: npm run test:local
      - run: npm run check:schema
      - run: npm run build
        env:
          VITE_BANKSETU_WORKER_URL: https://banksetu-client-api.banksetu2026.workers.dev
      - name: Verify Windows DPAPI encrypted restart fixtures
        run: npx electron desktop/storage-smoke.cjs
      - name: Test real Electron startup and preview cancellation
        run: npx electron desktop/print-smoke.cjs
      - name: Package Windows installer without code signing
        run: npx electron-builder --win nsis --publish never --config.forceCodeSigning=false
      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop-release/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          if (!(Test-Path desktop-release/latest.yml)) { throw 'Missing Windows update manifest.' }
          if (!(Get-ChildItem desktop-release/*.blockmap)) { throw 'Missing Windows update blockmap.' }
      - name: Stage Windows installer and update feed on the draft GitHub release
        if: inputs.staged_release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_RELEASE: ${{ inputs.staged_release }}
        run: |
          $draft = gh release view $env:STAGED_RELEASE --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Expected a draft release.' }
          $assets = @(Get-ChildItem desktop-release/*.exe, desktop-release/*.blockmap, desktop-release/latest.yml | ForEach-Object FullName)
          gh release upload $env:STAGED_RELEASE @assets --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft release asset upload failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.staged_release == ''
        with:
          name: BankSetu-Windows-SIGNED
          path: |
            desktop-release/*.exe
            desktop-release/*.blockmap
            desktop-release/latest.yml
          if-no-files-found: error
