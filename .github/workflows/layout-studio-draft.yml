name: Layout Studio Draft Validation
on:
  pull_request:
    branches: [main]
    paths:
      - src/Dashboard.tsx
      - src/CustomizeLayoutStudio.tsx
      - src/CustomizeLayoutStudio.css
      - src/layoutScanGeometry.ts
      - src/layoutProofPdf.ts
      - src/CustomBankDocument.tsx
      - src/SelectedBankDocument.tsx
      - src/WorkspaceTemplateDocument.tsx
      - src/WorkspaceTemplateDocument.css
      - src/layoutActivation.ts
      - src/layoutRuntimeValues.ts
      - src/layoutCustomerValue.ts
      - src/layoutFieldInference.ts
      - src/layoutOnDeviceOCR.ts
      - src/layoutVectorImport.ts
      - src/layoutTemplateAudit.ts
      - src/layoutVisualDiff.ts
      - cloudflare/layoutActivation.js
      - cloudflare/layoutTemplates.js
      - scripts/layout-*.test.mjs
      - cloudflare/worker.js
      - cloudflare/worker.test.js
      - scripts/layout-studio.test.mjs
      - .github/workflows/layout-studio-draft.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test scripts/layout-studio.test.mjs
      - run: node --test cloudflare/worker.test.js
      - run: npm run test:pr2
      - run: node --test scripts/bank-pdf.test.mjs scripts/passbook-info-layout.test.mjs scripts/union-passbook.test.mjs desktop/print-preview.test.cjs
      - run: npm run build
