<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=1064" />
    <link rel="manifest" href="/manifest.webmanifest?v=1064" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bank Setu helps approved bank and CSP administrators manage client workspaces, customer records, search, reports, and documents." />
    <title>Bank Setu | Smart CSP Management</title>
    <link rel="preload" href="/banksetu-logo.png" as="image" type="image/png" />
    <!-- First paint uses the same branded animation as the React loader, even before JS loads. -->
    <style>
      #root>.banksetu-bootstrap-loader{position:fixed;inset:0;box-sizing:border-box;min-height:100dvh;padding:24px 16px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(14,165,233,.23),transparent 28%),linear-gradient(145deg,#06142b,#111d42 58%,#170c36);color:#fff;font-family:Inter,Arial,sans-serif;text-align:center}
      .banksetu-bootstrap-portal{width:clamp(196px,29vmin,244px);height:clamp(196px,29vmin,244px);position:relative;display:grid;place-items:center}
      .banksetu-bootstrap-portal>img{display:block;position:relative;z-index:2;width:62%;height:62%;object-fit:contain;object-position:center;filter:drop-shadow(0 12px 23px rgba(34,211,238,.28))}
      .banksetu-bootstrap-ring{position:absolute;inset:0;border:1px solid rgba(103,232,249,.42);border-radius:50%;box-shadow:0 0 45px rgba(14,165,233,.12);animation:banksetu-bootstrap-orbit 3s linear infinite}
      .banksetu-bootstrap-ring:after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:#67e8f9;box-shadow:0 0 18px #67e8f9}
      .banksetu-bootstrap-ring:nth-child(2){inset:24px;border-color:rgba(167,139,250,.45);animation-direction:reverse;animation-duration:2.45s}
      .banksetu-bootstrap-ring:nth-child(3){inset:48px;border-color:rgba(251,191,36,.36);animation-duration:1.95s}
      .banksetu-bootstrap-copy{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:24px;max-width:min(420px,90vw)}
      .banksetu-bootstrap-copy strong{font-size:17px;letter-spacing:.12em}
      .banksetu-bootstrap-copy>span{font-size:12px;color:#cbd5e1}
      .banksetu-bootstrap-progress{width:min(270px,76vw);height:5px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.12);position:relative}
      .banksetu-bootstrap-progress>i{position:absolute;inset:0 auto 0 0;width:34%;border-radius:inherit;background:linear-gradient(90deg,#22d3ee,#60a5fa,#a78bfa);animation:banksetu-bootstrap-sweep 1.25s ease-in-out infinite}
      .banksetu-bootstrap-copy small{color:#94a3b8;font-size:9px;line-height:1.5}
      @keyframes banksetu-bootstrap-orbit{to{transform:rotate(360deg)}}
      @keyframes banksetu-bootstrap-sweep{from{transform:translateX(-105%)}to{transform:translateX(260%)}}
      @media(prefers-reduced-motion:reduce){.banksetu-bootstrap-loader *{animation:none!important}.banksetu-bootstrap-progress>i{width:100%;opacity:.7}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="banksetu-bootstrap-loader" role="status" aria-live="polite" aria-label="Bank Setu secure loading">
        <div class="banksetu-bootstrap-portal" aria-hidden="true">
          <span class="banksetu-bootstrap-ring"></span>
          <span class="banksetu-bootstrap-ring"></span>
          <span class="banksetu-bootstrap-ring"></span>
          <img src="/banksetu-logo.png" alt="" width="152" height="152" fetchpriority="high" />
        </div>
        <div class="banksetu-bootstrap-copy">
          <strong>BANK SETU</strong>
          <span>Preparing your secure Bank Setu workspace…</span>
          <div class="banksetu-bootstrap-progress" aria-hidden="true"><i></i></div>
          <small>Authentication, licensing and offline recovery continue securely without artificial delay.</small>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
